<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Everyday Ham - Host Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  /* ============================================================
     THE EVERYDAY HAM - HOST TRACKER  (v2: 72-hour history board)
     Portrait digital signage: 1080 wide x 1920 tall (DakBoard)
     Non-interactive, display only.
     ============================================================ */

  :root {
    --navy:        #152333;
    --navy-dark:   #0d1620;
    --navy-light:  #1e3347;
    --orange:      #ff7030;
    --cream:       #fdf8e5;
    --cream-80:    rgba(253, 248, 229, 0.80);
    --cream-50:    rgba(253, 248, 229, 0.50);
    --cream-30:    rgba(253, 248, 229, 0.30);
    --good:        #2ecc71;
    --warn:        #f39c12;
    --bad:         #e74c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--navy-dark);
    color: var(--cream);
    font-family: 'Source Sans Pro', sans-serif;
  }

  #stage {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1200px 700px at 12% -8%, rgba(255,112,48,0.10), transparent 60%),
      radial-gradient(1000px 700px at 100% 108%, rgba(255,112,48,0.08), transparent 60%),
      linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 42%, var(--navy-dark) 100%);
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    padding: 34px 40px 22px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .brand .kicker {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 6px;
    font-size: 22px;
    color: var(--orange);
    text-transform: uppercase;
  }
  .brand .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 58px;
    line-height: 1;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .brand .title b { font-weight: 600; }
  .clock { text-align: right; }
  .clock .zulu {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 46px;
    line-height: 1;
    letter-spacing: 2px;
  }
  .clock .zulu .z {
    color: var(--orange);
    font-size: 26px;
    vertical-align: 6px;
    margin-left: 4px;
  }
  .clock .local {
    font-size: 20px;
    color: var(--cream-50);
    letter-spacing: 1px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .rule {
    height: 2px;
    margin: 0 40px;
    background: linear-gradient(90deg, var(--orange) 0%, rgba(255,112,48,0.35) 30%, rgba(255,112,48,0) 88%);
  }

  /* ---------- Map region ---------- */
  #mapwrap {
    position: relative;
    flex: 1 1 auto;
    margin: 22px 40px 18px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  #map { position: absolute; inset: 0; background: #e9eef2; }
  #map .leaflet-container { background: #e9eef2; }

  /* Gentle navy frame; light enough that labels stay readable. */
  #mapwrap::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 90px 18px rgba(13,22,32,0.30);
    background:
      radial-gradient(125% 95% at 50% 50%, transparent 68%, rgba(13,22,32,0.20) 100%);
  }

  #trails, #avatars {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #trails { z-index: 400; }
  #avatars { z-index: 401; }

  /* ---------- Host markers ---------- */
  .host-marker {
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
    will-change: transform;
  }
  .host-marker .center {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .host-ring {
    position: absolute;
    left: 50%; top: 0;
    width: 64px; height: 64px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid var(--hc);
    opacity: 0;
  }
  .host-marker.rolling .host-ring {
    opacity: 0.55;
    animation: ringpulse 1.8s ease-out infinite;
  }
  @keyframes ringpulse {
    0%   { transform: translate(-50%,-50%) scale(0.65); opacity: 0.6; }
    70%  { opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }
  .host-beam {
    position: absolute;
    left: 50%; top: 0;
    width: 0; height: 0;
    transform: translate(-50%, -50%) rotate(var(--course, 0deg));
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .host-beam::before {
    content: "";
    position: absolute;
    left: -9px; top: -46px;
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 18px solid var(--hc);
    filter: drop-shadow(0 0 6px var(--hc));
  }
  .host-marker.rolling .host-beam { opacity: 0.95; }

  .host-body { position: relative; z-index: 2; will-change: transform; }
  .host-marker.rolling .host-body { animation: bob 0.85s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .host-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--hc);
    border: 3px solid var(--cream);
    box-shadow: 0 0 14px rgba(0,0,0,0.55), 0 0 18px var(--hc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--navy-dark);
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }
  .host-avatar img.pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .host-avatar:not(.imgloaded) img.pose { display: none; }
  .host-avatar.imgloaded .ini { display: none; }
  /* Not-heard markers fade gently (readable, but clearly "asleep").
     Old values were grayscale(0.7) / opacity 0.55, which washed out badly. */
  .host-marker.dim .host-avatar {
    filter: grayscale(0.35);
    opacity: 0.82;
    box-shadow: 0 0 14px rgba(0,0,0,0.55);
  }
  .host-tag {
    margin-top: 5px;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--cream);
    background: rgba(13,22,32,0.72);
    border: 1px solid var(--hc);
    padding: 1px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* Hosts the inset has taken over. On the wide map they are stacked on top
     of each other, so their tags collide into a smear; the panel below names
     them properly a few inches away, and the avatar colours still say who. */
  .host-marker.grouped .host-tag { display: none; }

  /* Glyph badge on the callsign tag, tying a marker to its trail. The roster
     cards do without one: down there the host colour already says who. */
  .glyph { vertical-align: -1px; margin-right: 6px; }
  .host-marker.dim .glyph { opacity: 0.7; }

  /* ---------- Map overlays ---------- */

  .window-badge {
    position: absolute;
    right: 16px; top: 16px;
    z-index: 402;
    background: rgba(13,22,32,0.9);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 2px;
    font-size: 16px;
    text-transform: uppercase;
    color: var(--cream-80);
  }
  .window-badge b { color: var(--orange); font-weight: 600; }

  /* Age scale: fresh (green) -> 3 days (red). Sits top-left, bracketing the
     window badge opposite it; the bottom-left corner it used to occupy now
     belongs to the detail inset. */
  .age-legend {
    position: absolute;
    left: 16px; top: 16px;
    z-index: 402;
    background: rgba(13,22,32,0.9);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    width: 240px;
  }
  .age-legend .lh {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 7px;
  }
  .age-bar {
    height: 8px;
    border-radius: 4px;
    /* End stop tracks TRAIL_ALPHA_OLD / TRAIL_ALPHA_FRESH, so the legend
       shows the fade the trails actually use. */
    background: linear-gradient(90deg, rgba(253,248,229,0.95) 0%, rgba(253,248,229,0.42) 100%);
  }
  .age-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cream-50);
  }

  /* ---------- Detail inset ----------
     The wide map keeps the road-trip story -- the long line from home down to
     wherever somebody drove. This keeps the people who stayed put legible
     while it does. Only mounted once the group actually spreads, and the wide
     fit reserves this corner so it never parks a host underneath the panel. */
  #inset {
    position: absolute;
    left: 16px; bottom: 14px;
    z-index: 403;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(13,22,32,0.94);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 14px 44px rgba(0,0,0,0.60);
  }
  #inset[hidden] { display: none; }
  .inset-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
    padding: 8px 13px 7px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
  }
  .inset-head .ih-tag {
    flex: 0 0 auto;
    font-size: 12px; font-weight: 500; letter-spacing: 2px;
    color: var(--orange);
  }
  .inset-head .ih-place {
    min-width: 0;
    font-size: 15px; font-weight: 500; letter-spacing: 1.2px;
    color: var(--cream);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .inset-body { position: relative; }
  #insetmap { position: absolute; inset: 0; background: #e9eef2; }
  #insettrails, #insetavatars {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #insettrails { z-index: 400; }
  #insetavatars { z-index: 401; }

  .ins-marker { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .ins-marker .center {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
  }
  .ins-face {
    position: relative;
    width: 30px; height: 30px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--hc);
    border: 2px solid var(--cream);
    box-shadow: 0 0 9px rgba(0,0,0,0.5), 0 0 12px var(--hc);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px;
    color: var(--navy-dark);
  }
  .ins-face img.pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ins-face:not(.imgloaded) img.pose { display: none; }
  .ins-face.imgloaded .ini { display: none; }
  .ins-tag {
    margin-top: 3px;
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--cream);
    background: rgba(13,22,32,0.80);
    border: 1px solid var(--hc);
    padding: 0 6px 1px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .ins-marker.dim { opacity: 0.72; }

  /* ---------- Bottom status cards ---------- */
  #cards {
    flex: 0 0 auto;
    padding: 0 40px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 62px 1fr auto;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-left: 6px solid var(--hc);
    border-radius: 14px;
    padding: 16px 22px 16px 20px;
  }
  .card .avatar {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--hc);
    border: 3px solid var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 21px;
    color: var(--navy-dark);
    box-shadow: 0 0 14px var(--hc);
    position: relative;
    overflow: hidden;
  }
  .card .avatar img.pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .avatar:not(.imgloaded) img.pose { display: none; }
  .card .avatar.imgloaded .ini { display: none; }
  .card.notheard .avatar { filter: grayscale(0.35); opacity: 0.82; box-shadow: 0 0 14px rgba(0,0,0,0.4); }
  /* No beacons at all in the window, so there is no position to derive a
     pose from. Show the host's home portrait, dimmed well past 'notheard',
     so the card reads as quiet rather than broken. */
  .card.nodata { border-left-color: var(--cream-30); }
  .card.nodata .avatar {
    filter: grayscale(1) brightness(0.62);
    opacity: 0.36;
    border-color: var(--cream-30);
    box-shadow: none;
  }
  /* Border is currentColor, so this mutes the ring with the text. Without it
     the pill outshines the live hosts' pills on the quietest card. */
  .card.nodata .state-pill { color: var(--cream-50); }
  .card .who { min-width: 0; }
  .card .call {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .card .name { font-size: 18px; color: var(--cream-80); margin-top: 5px; letter-spacing: 0.3px; }
  .card .heard { font-size: 15px; color: var(--cream-50); margin-top: 3px; letter-spacing: 0.3px; text-transform: uppercase; }

  .card .metrics {
    display: flex;
    gap: 22px;
    align-items: center;
    text-align: right;
  }
  .metric .val {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 34px;
    line-height: 1;
  }
  .metric .val small { font-size: 16px; color: var(--cream-50); font-weight: 400; margin-left: 3px; }
  .metric .lbl {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--cream-50);
    margin-top: 6px;
  }
  .state-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .state-pill .sd { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .state-ROLLING { color: var(--good); }
  .state-PARKED  { color: var(--warn); }
  .state-HOME    { color: var(--orange); }
  .state-NOTHEARD{ color: var(--cream-50); }

  /* ---------- Footer ---------- */
  footer {
    flex: 0 0 auto;
    padding: 8px 40px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    color: var(--cream-50);
    letter-spacing: 0.4px;
  }
  footer .src { display: flex; align-items: center; gap: 10px; }
  .stale-badge {
    display: none;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--bad);
    border: 1px solid var(--bad);
    border-radius: 6px;
    padding: 3px 9px;
  }
  .stale-badge.show { display: inline-block; }

  .leaflet-control-attribution {
    background: rgba(13,22,32,0.6) !important;
    color: var(--cream-50) !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: var(--cream-80) !important; }
</style>
</head>
<body>
<div id="stage">

  <header>
    <div class="brand">
      <div class="kicker">The Everyday Ham</div>
      <div class="title">Host <b>Tracker</b></div>
    </div>
    <div class="clock">
      <div class="zulu" id="zulu">--:--:--<span class="z">Z</span></div>
      <div class="local" id="local">--</div>
    </div>
  </header>

  <div class="rule"></div>

  <div id="mapwrap">
    <div id="map"></div>
    <canvas id="trails"></canvas>
    <div id="avatars"></div>

    <div class="window-badge">Last <b>72</b> hours</div>

    <div class="age-legend">
      <div class="lh">Trail age</div>
      <div class="age-bar"></div>
      <div class="age-ends"><span>Now</span><span>3 days</span></div>
    </div>

    <div id="inset" hidden>
      <div class="inset-head">
        <span class="ih-tag">Detail</span>
        <span class="ih-place" data-inset-place>--</span>
      </div>
      <div class="inset-body">
        <div id="insetmap"></div>
        <canvas id="insettrails"></canvas>
        <div id="insetavatars"></div>
      </div>
    </div>
  </div>

  <div id="cards"></div>

  <footer>
    <div class="src">
      <span id="srcText">Simulated data</span>
      <span class="stale-badge" id="staleBadge">Stale</span>
    </div>
    <div id="updated">Last update --</div>
  </footer>

</div>

<script>
/* ============================================================
   CONFIG  -  tune everything here
   ============================================================ */

const DATA_URL        = 'host-tracker.json';
const FORCE_SIMULATED = false;   // set true to always use the demo data

// Home base of the show. "From home" on the cards is measured per host;
// Clarkston anchors the fallback view when nobody has data yet.
const CLARKSTON = { lat: 42.7356, lng: -83.4183 };

// Roster. `call` must match the poller output keys (base callsigns).
const HOSTS = [
  { call: 'K8JKU', name: 'James', color: '#4a90e2', initials: 'JA', shape: 'circle',
    home: { lat: 42.7356, lng: -83.4183 },                          // Clarkston
    poses: { home: 'icons/james-home.png', portable: 'icons/james-portable.png', mobile: 'icons/james-mobile.png' } },

  { call: 'N8JRD', name: 'Jim', color: '#ff7030', initials: 'JI', shape: 'triangle',
    home: { lat: 42.4606, lng: -83.6516 },                          // South Lyon
    poses: { home: 'icons/jim-home.png', portable: 'icons/jim-portable.png', mobile: 'icons/jim-mobile.png' } },

  { call: 'W8KNX', name: 'Rory', color: '#9b59b6', initials: 'RO', shape: 'square',
    home: { lat: 42.4606, lng: -83.6516 },                          // South Lyon
    poses: { home: 'icons/rory-home.png', portable: 'icons/rory-portable.png', mobile: 'icons/rory-mobile.png' } },
];

// Timing / behaviour
const MASTER_TICK_MS = 1000;   // single master tick: clock, cards, poll cadence
const POLL_SECONDS   = 120;    // how often to re-fetch the snapshot
const TRAIL_HOURS    = 72;     // history window (3 days). Match the poller.
const FRESH_MINUTES  = 10;     // beacon this recent -> vivid green trail head
const STALE_MINUTES  = 45;     // no beacon this long -> NOT HEARD
const DATA_STALE_MIN = 20;     // snapshot older than this -> footer stale badge

// Classification
const MOVING_SPEED_KMH = 8;    // above this a station is ROLLING
const HOME_RADIUS_KM   = 0.4;  // within this of `home` -> HOME (else PARKED)
const ROLL_GAP_CAP_MIN = 20;   // max minutes one moving beacon can add to
                               // "time rolling" (guards against sparse gaps)
const SPEED_SANITY_KMH = 200;  // ignore beacons above this for Top speed
                               // (corrupt APRS packets happen)

// Display units
const KM_TO_MI = 0.621371;

// Rendering (Pi 5 has headroom; drop RENDER_FPS to 15-20 on weak hardware)
const RENDER_FPS   = 30;
const TRAIL_WIDTH  = 4;        // age-colored core line
const CASING_WIDTH = 9;        // host-color identity casing under the core
const CASING_ALPHA = 0.30;

// Trail age is read as opacity. The tail is deliberately dimmer than the head,
// but it still has to be legible from across the room, so it fades to a floor
// rather than to nothing. Raise TRAIL_ALPHA_OLD if three days back is still
// too faint; lower it if the old track competes with today's.
const TRAIL_ALPHA_FRESH = 0.95;  // opacity at the head (now)
const TRAIL_ALPHA_OLD   = 0.42;  // opacity at the tail (72h back)
const TRAIL_FADE_GAMMA  = 1.15;  // >1 holds the bright end longer
const TRAIL_TAPER_OLD   = 0.72;  // width multiplier at the tail

// Per-host glyph, so overlapping trails stay tellable apart at a glance.
// Available: circle, triangle, square, diamond, pentagon, hexagon, star,
// plus, cross, chevron.
// Circle / triangle / square are the trio that reads fastest at this size;
// the rest are here for when the roster grows. Hosts without a `shape` fall
// back to this cycle in roster order.
const SHAPE_CYCLE = ['circle', 'triangle', 'square', 'diamond', 'hexagon', 'star'];
const TRAIL_GLYPH_HOURS = 6;   // stamp the glyph along the trail this often, so
                               // identity survives where routes overlap. 0 = off
const TRAIL_GLYPH_R     = 5;   // radius of those stamps
const PULSE_PERIOD_S = 14;     // seconds for the traveling pulse to run a trail
const MIDNIGHT_TICKS = true;   // small cream dots at each local midnight
const TRAIL_OFFSET_PX = 7;     // sideways separation between hosts' trails so
                               // shared roads render as parallel ribbons
                               // (transit-map style). 0 disables.

const MODE_PALETTE = ['#ff7030', '#4a90e2', '#9b59b6', '#2ecc71'];

// Basemap.
// CARTO's raster basemaps are no longer anonymous: unkeyed tiles come back
// stamped with a diagonal "API KEY REQUIRED" watermark, and CARTO is retiring

/* ============================================================
   GEO HELPERS
   ============================================================ */
function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
// Maidenhead locator. Out past the CITIES list a grid square is the honest
// answer to "where is he", it is what a ham would say on the air anyway, and
// unlike a spelled-out distance it stays short enough not to blow the card's
// state pill out and squeeze the column beside it.
function gridSquare(p) {
  const lon = p.lng + 180, lat = p.lat + 90;
  const FIELD = 'ABCDEFGHIJKLMNOPQR', SUB = 'abcdefghijklmnopqrstuvwx';
  return FIELD[Math.floor(lon / 20)] + FIELD[Math.floor(lat / 10)] +
         Math.floor((lon % 20) / 2) + Math.floor(lat % 10) +
         SUB[Math.floor((lon % 2) * 12)] + SUB[Math.floor((lat % 1) * 24)];
}

function bearingDeg(a, b) {
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function compass(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg/45) % 8];
}

function nearestCity(p) {
  let best = null, bestKm = Infinity;
  for (const [name, lat, lng] of CITIES) {
    const km = haversineKm(p, { lat, lng });
    if (km < bestKm) { bestKm = km; best = name; }
  }
  if (!best) return '--';
  // The list is Michigan-centric on purpose. A host in Florida would otherwise
  // be labelled with whichever Michigan town happened to be least far away,
  // which reads as a bug. Past CITY_MAX_KM, fall back to the grid square.
  if (bestKm > CITY_MAX_KM) return 'Grid ' + gridSquare(p).slice(0, 4);
  return best;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function rgba(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function hexA(hex, a) { return rgba(hexToRgb(hex), a); }

/* ============================================================
   SIMULATED DATA  (72h)
   A believable 3-day demo so the board runs before the poller
   populates. The daily schedule repeats with slight variation.
   ============================================================ */
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// One day of keyframes per host: [minuteOfDay, lat, lng]
const SIM_SCHEDULES = {
  'K8JKU': [
    [0,   42.7356,-83.4183],[600, 42.7356,-83.4183],
    [660, 42.7942,-83.6247],[780, 42.7942,-83.6247],
    [840, 42.8517,-83.4430],[960, 42.8517,-83.4430],
    [1080,42.7356,-83.4183],[1440,42.7356,-83.4183]
  ],
  'N8JRD': [
    [0,   42.4606,-83.6516],[420, 42.4606,-83.6516],
    [510, 42.4895,-83.1446],[960, 42.4895,-83.1446],
    [1050,42.4606,-83.6516],[1440,42.4606,-83.6516]
  ],
  'W8KNX': [
    [0,   42.4606,-83.6516],[720, 42.4606,-83.6516],
    [750, 42.5251,-83.7791],[810, 42.5251,-83.7791],
    [840, 42.4606,-83.6516],[1440,42.4606,-83.6516]
  ]
};

function sampleSchedule(sched, minute) {
  if (minute <= sched[0][0]) return { lat: sched[0][1], lng: sched[0][2] };
  const last = sched[sched.length-1];
  if (minute >= last[0]) return { lat: last[1], lng: last[2] };
  for (let i = 0; i < sched.length-1; i++) {
    const a = sched[i], b = sched[i+1];
    if (minute >= a[0] && minute <= b[0]) {
      const f = (minute - a[0]) / (b[0] - a[0]);
      return { lat: a[1] + (b[1]-a[1])*f, lng: a[2] + (b[2]-a[2])*f };
    }
  }
  return { lat: last[1], lng: last[2] };
}

function buildSimulated() {
  const now = Date.now();
  const totalMin = TRAIL_HOURS * 60;
  const stepMin = 6;
  const roster = HOSTS.map((h, hi) => {
    const rand = mulberry32(0x9E37 + hi*7919);
    const sched = SIM_SCHEDULES[h.call] || [[0,h.home.lat,h.home.lng],[1440,h.home.lat,h.home.lng]];
    const track = [];
    let prev = null;
    for (let m = 0; m <= totalMin; m += stepMin) {
      const dayMin = m % 1440;
      const p = sampleSchedule(sched, dayMin);
      const moving = prev && haversineKm(prev, p) > 0.02;
      const jitter = moving ? 0.0016 : 0.00025;
      const lat = p.lat + (rand()-0.5)*jitter;
      const lng = p.lng + (rand()-0.5)*jitter;
      const time = now - (totalMin - m)*60000;
      let speed = 0, course = 0;
      if (prev) {
        const distKm = haversineKm(prev, { lat, lng });
        speed = distKm / (stepMin/60);
        if (distKm > 0.03) course = bearingDeg(prev, { lat, lng });
        else course = prev.course || 0;
      }
      const pt = { time, lat, lng, speed, course };
      track.push(pt);
      prev = pt;
    }
    return { call: h.call, name: h.name, color: h.color, shape: h.shape,
             initials: h.initials, home: h.home, poses: h.poses, track };
  });
  return { generated: now, source: 'Simulated data', hosts: roster };
}

/* ============================================================
   DATA LOADING
   Snapshot schema (what the poller writes):
   {
     "generated": 1782939161,                  // unix seconds (or ISO8601)
     "hosts": [
       { "callsign": "K8JKU",
         "track": [ { "time": 1782866807,
                      "lat": 42.73, "lng": -83.41,
                      "speed": 0, "course": 0 } ] }  // speed km/h, course deg
     ]
   }
   Roster metadata (name/color/poses/home) lives in HOSTS above.
   ============================================================ */
function parseTime(t) {
  if (typeof t === 'number') return t < 1e12 ? t*1000 : t;
  let s = String(t);
  if (!/[zZ]|[+\-]\d\d:?\d\d$/.test(s)) s += 'Z';
  return Date.parse(s);
}

async function loadData() {
  if (FORCE_SIMULATED) return applyData(buildSimulated());
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const raw = await res.json();
    const genMs = parseTime(raw.generated || Date.now());
    const cutoff = Date.now() - TRAIL_HOURS*3600*1000;
    let anyPoints = false;
    const roster = HOSTS.map(h => {
      const rec = (raw.hosts || []).find(x => (x.callsign || x.call) === h.call);
      const track = ((rec && rec.track) || [])
        .map(p => ({ time: parseTime(p.time), lat: +p.lat, lng: +p.lng,
                     speed: +p.speed || 0, course: +p.course || 0 }))
        .filter(p => p.time >= cutoff)
        .sort((a,b) => a.time - b.time);
      if (track.length) anyPoints = true;
      return { call: h.call, name: h.name, color: h.color, shape: h.shape,
               initials: h.initials, home: h.home, poses: h.poses, track };
    });
    if (!anyPoints && !hosts.length) return applyData(buildSimulated());
    applyData({ generated: genMs, source: 'Live via aprs.fi', hosts: roster });
  } catch (e) {
    if (!hosts.length) applyData(buildSimulated());
    else sourceLabel = 'Simulated data';
  }
}

function applyData(data) {
  const sig = data.hosts.map(h => {
    const last = h.track[h.track.length-1];
    return h.call + ':' + (last ? Math.round(last.time/1000)+','+h.track.length : '0');
  }).join('|');

  hosts = data.hosts.map((h, i) => ({
    ...h,
    color: h.color || MODE_PALETTE[i % MODE_PALETTE.length],
    shape: h.shape || SHAPE_CYCLE[i % SHAPE_CYCLE.length]
  }));
  dataGeneratedMs = data.generated;
  sourceLabel = data.source || sourceLabel;

  if (sig !== lastSignature) {
    buildCards();
    lastSignature = sig;
  }

  if (AUTO_REFIT && map) {
    const fsig = fitSignature();
    if (fsig !== lastFitSig) { lastFitSig = fsig; frameBounds(); }
  }
}

// Resolves BASEMAP to a definition we can actually draw, falling back to
// BASEMAP_NO_KEY when the chosen style needs a key we do not have.
function pickBasemap() {
  let name = BASEMAPS[BASEMAP] ? BASEMAP : BASEMAP_NO_KEY;
  if (BASEMAPS[name].needsKey && !basemapKey(BASEMAPS[name])) {
    console.warn('Basemap "' + name + '" needs an API key; falling back to "' +
                 BASEMAP_NO_KEY + '".');
    name = BASEMAP_NO_KEY;
  }
  return { name: name, def: BASEMAPS[name] };
}

function basemapKey(def) {
  if (def.keyVar === 'carto')  return CARTO_API_KEY;
  if (def.keyVar === 'stadia') return STADIA_API_KEY;
  return '';
}

function rasterLayer(def) {
  const key = basemapKey(def);
  const url = (def.keyParam && key)
    ? def.url + '?' + def.keyParam + '=' + encodeURIComponent(key)
    : def.url;
  return L.tileLayer(url, Object.assign({ attribution: def.attrib }, def.opts || {}));
}

const MAPLIBRE_PLUGIN_JS = [
  'https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js',
  'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js'
];

function loadAsset(url, isCss) {
  return new Promise((resolve, reject) => {
    const el = isCss ? document.createElement('link') : document.createElement('script');
    if (isCss) { el.rel = 'stylesheet'; el.href = url; } else { el.src = url; }
    el.onload  = () => resolve(url);
    el.onerror = () => reject(new Error('could not load ' + url));
    document.head.appendChild(el);
  });
}

async function loadFirstAsset(urls, isCss) {
  let last;
  for (const url of urls) {
    try { return await loadAsset(url, isCss); } catch (err) { last = err; }
  }
  throw last;
}

let maplibreReady = null;
function loadMapLibre() {
  if (!maplibreReady) {
    maplibreReady = (async () => {
      await loadFirstAsset(MAPLIBRE_CSS, true).catch(() => {});
      await loadFirstAsset(MAPLIBRE_JS);
      await loadFirstAsset(MAPLIBRE_PLUGIN_JS);
      if (!L.maplibreGL) throw new Error('maplibre-gl-leaflet did not register');
    })();
  }
  return maplibreReady;
}

// How long a vector basemap gets to paint its first frame before we give up on
// it. The board runs unattended, so a WebGL context that loads but never
// renders has to degrade to raster on its own.
const VECTOR_TIMEOUT_MS = 12000;

// Same idea for raster: this many failed tiles and we swap to the keyless
// fallback. It catches a tile service going away -- CARTO retiring raster, a
// key expiring into 403s. It does NOT catch a watermark or a "401" image:
// those arrive as perfectly good tiles, so only your eyes will spot them.
const RASTER_ERROR_LIMIT = 8;

// Adds a raster basemap and watches it. If its tiles start failing outright we
// swap to the keyless fallback once, rather than leaving the board bare.
function addGuardedRaster(map, name, def) {
  const layer = rasterLayer(def);
  if (name !== BASEMAP_NO_KEY) {
    let errors = 0, swapped = false;
    layer.on('tileerror', () => {
      if (swapped || ++errors < RASTER_ERROR_LIMIT) return;
      swapped = true;
      console.warn('Basemap "' + name + '" is failing (' + errors +
                   ' tile errors); falling back to "' + BASEMAP_NO_KEY + '".');
      map.removeLayer(layer);
      rasterLayer(BASEMAPS[BASEMAP_NO_KEY]).addTo(map);
    });
  }
  layer.addTo(map);
}

// Adds the basemap under the trails. Vector styles arrive asynchronously; the
// trail canvas does not depend on them, so a late basemap only means the map
// paints its background colour for a moment.
function addBaseLayer(map) {
  const pick = pickBasemap();
  if (pick.def.type !== 'vector') { addGuardedRaster(map, pick.name, pick.def); return; }

  let settled = false;
  const fallback = (why) => {
    if (settled) return;
    settled = true;
    console.warn('Vector basemap "' + pick.name + '" unavailable (' + why +
                 '); falling back to "' + BASEMAP_NO_KEY + '".');
    if (glLayer && map.hasLayer(glLayer)) { try { map.removeLayer(glLayer); } catch (e) {} }
    rasterLayer(BASEMAPS[BASEMAP_NO_KEY]).addTo(map);
  };

  let glLayer = null;
  // The fallback itself is added unguarded: there is nowhere further to fall.
  loadMapLibre().then(() => {
    glLayer = L.maplibreGL({ style: pick.def.style, attribution: pick.def.attrib }).addTo(map);

    // Loading the plugin is not proof it works: a MapLibre version mismatch or a
    // board with no usable WebGL fails here, after the scripts are in.
    const gl = glLayer.getMaplibreMap && glLayer.getMaplibreMap();
    if (!gl) { fallback('no maplibre map instance'); return; }
    gl.on('load',  () => { settled = true; });
    gl.on('error', e => fallback((e && e.error && e.error.message) || 'style error'));
    setTimeout(() => fallback('no first frame in ' + (VECTOR_TIMEOUT_MS / 1000) + 's'),
               VECTOR_TIMEOUT_MS);
  }).catch(err => fallback(err.message));
}

function initMap() {
  map = L.map('map', {
    zoomControl: false, attributionControl: true,
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false,
    inertia: false, zoomSnap: 0.1
  });
  addBaseLayer(map);

  trailCanvas = document.getElementById('trails');
  ctx = trailCanvas.getContext('2d');
  avatarLayer = document.getElementById('avatars');

  sizeCanvas();
  window.addEventListener('resize', () => {
    sizeCanvas();
    if (insetMap) { insetMap.invalidateSize(); sizeInsetCanvas(); }
    frameBounds();
  });
}

function sizeCanvas() {
  const w = document.getElementById('mapwrap').clientWidth;
  const h = document.getElementById('mapwrap').clientHeight;
  const dpr = window.devicePixelRatio || 1;
  trailCanvas.width = w * dpr;
  trailCanvas.height = h * dpr;
  trailCanvas.style.width = w + 'px';
  trailCanvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ============================================================
   DETAIL INSET
   A second little map, framed on whoever is still together, so the wide view
   can keep somebody's road trip on screen without the rest of us collapsing
   into one dot. Mounted lazily -- a board where nobody ever leaves the county
   never pays for a second basemap.
   ============================================================ */
function initInsetMap() {
  const panel = document.getElementById('inset');
  panel.style.width = INSET_W + 'px';
  panel.querySelector('.inset-body').style.height = INSET_H + 'px';

  insetMap = L.map('insetmap', {
    zoomControl: false, attributionControl: false,  // the big map carries it
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false,
    inertia: false, zoomSnap: 0.1
  });
  addBaseLayer(insetMap);

  insetCanvas = document.getElementById('insettrails');
  insetCtx = insetCanvas.getContext('2d');
  insetAvatarLayer = document.getElementById('insetavatars');
  sizeInsetCanvas();
}

function sizeInsetCanvas() {
  const body = insetCanvas.parentElement;
  const w = body.clientWidth, h = body.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  insetCanvas.width = w * dpr;
  insetCanvas.height = h * dpr;
  insetCanvas.style.width = w + 'px';
  insetCanvas.style.height = h + 'px';
  insetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// The live host objects the inset is framed on, resolved fresh from whatever
// applyData last built.
function insetRoster() {
  return insetHosts
    .map(call => hosts.find(h => h.call === call))
    .filter(Boolean);
}

// Pass the hosts to frame, or null to shut the panel. Fewer than two is the
// same as null: a lone host is a lone dot, and a dot is legible anywhere on
// the wide map without help.
function setInset(list) {
  const panel = document.getElementById('inset');
  if (!list || list.length < 2) {
    insetHosts = [];
    panel.hidden = true;
    return;
  }
  const opening = panel.hidden;
  panel.hidden = false;                      // Leaflet needs a laid-out box
  if (!insetMap) initInsetMap();
  else if (opening) { insetMap.invalidateSize(); sizeInsetCanvas(); }
  insetHosts = list.map(h => h.call);

  const b = L.latLngBounds(list.reduce((acc, h) => acc.concat(hostFitPoints(h)), []));
  if (b.getNorthEast().equals(b.getSouthWest())) {
    insetMap.setView(b.getCenter(), INSET_MAX_ZOOM, { animate: false });
  } else {
    insetMap.fitBounds(b, {
      padding: [INSET_PADDING_PX, INSET_PADDING_PX],
      maxZoom: INSET_MAX_ZOOM,
      animate: false
    });
  }
  const c = b.getCenter();
  document.querySelector('[data-inset-place]').textContent =
    nearestCity({ lat: c.lat, lng: c.lng });
}

function drawInsetTrails() {
  const w = insetCanvas.clientWidth, h = insetCanvas.clientHeight;
  insetCtx.clearRect(0, 0, w, h);
  const now = Date.now();
  const windowMs = TRAIL_HOURS * 3600 * 1000;
  const roster = insetRoster();

  roster.forEach((host, hi) => {
    const pts = host.track;
    if (!pts || pts.length < 2) return;
    const off = (hi - (roster.length - 1) / 2) * INSET_TRAIL_OFFSET_PX;
    const proj = offsetPolyline(pts.map(p => ll(p, insetMap)), off);

    insetCtx.lineCap = 'round';
    insetCtx.lineJoin = 'round';
    // One pass, no casing, no glyph stamps, no travelling pulse: at panel size
    // that decoration turns into noise. Age still fades and tapers, so the
    // inset speaks the same language as the map above it.
    for (let i = 1; i < proj.length; i++) {
      const t = Math.min(1, (now - pts[i].time) / windowMs);
      const fade = Math.pow(1 - t, TRAIL_FADE_GAMMA);
      const a = TRAIL_ALPHA_OLD + (TRAIL_ALPHA_FRESH - TRAIL_ALPHA_OLD) * fade;
      insetCtx.strokeStyle = hexA(host.color, a);
      insetCtx.lineWidth = INSET_TRAIL_WIDTH *
        (TRAIL_TAPER_OLD + (1 - TRAIL_TAPER_OLD) * fade);
      insetCtx.beginPath();
      insetCtx.moveTo(proj[i-1].x, proj[i-1].y);
      insetCtx.lineTo(proj[i].x, proj[i].y);
      insetCtx.stroke();
    }
  });
}

const insetMarkerEls = {};
function drawInsetAvatars() {
  const shown = {};
  insetRoster().forEach(host => {
    let el = insetMarkerEls[host.call];
    if (!el) {
      el = document.createElement('div');
      el.className = 'ins-marker';
      el.style.setProperty('--hc', host.color);
      el.innerHTML = `
        <div class="center">
          <div class="ins-face"><img class="pose" alt=""><span class="ini">${host.initials || ''}</span></div>
          <div class="ins-tag">${host.call}</div>
        </div>`;
      insetAvatarLayer.appendChild(el);
      insetMarkerEls[host.call] = el;
    }
    const d = deriveHost(host);
    if (d.empty) return;
    shown[host.call] = true;
    el.style.display = '';
    const pt = ll(d.latest, insetMap);
    el.style.transform = `translate3d(${pt.x}px, ${pt.y}px, 0)`;
    setPose(el.querySelector('.ins-face'), poseFor(host, d.state));
    el.classList.toggle('dim', d.state === 'NOTHEARD');
  });
  for (const call in insetMarkerEls) {
    if (!shown[call]) insetMarkerEls[call].style.display = 'none';
  }
}

/* ============================================================
   FRAMING
   ============================================================ */
function hostFitPoints(h) {
  if (!h.track || !h.track.length) return [];
  if (FIT_MODE === 'trails') return h.track.map(p => [p.lat, p.lng]);
  const last = h.track[h.track.length - 1];
  return [[last.lat, last.lng]];
}

// Widest gap between any two hosts right now, in miles. This is the number
// the inset triggers on, because it is the one you can judge by eye when you
// look up at the board and decide it has gone wrong.
function spreadMi(list) {
  let max = 0;
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const d = haversineKm(list[i].latest, list[j].latest) * KM_TO_MI;
      if (d > max) max = d;
    }
  }
  return max;
}

// Which host is the odd one out? Score each by the total distance to everyone
// else: two hosts in Oakland County both score low, the one in Florida scores
// huge. Ties (a two-host board, where both sums are identical) go to whoever
// is further from home, so the board stays anchored where the show lives.
function mostOutlying(list) {
  const sums = list.map(a => list.reduce((t, b) => t + haversineKm(a.latest, b.latest), 0));
  let worst = 0;
  for (let i = 1; i < list.length; i++) {
    const d = sums[i] - sums[worst];
    if (d > 1) worst = i;
    else if (Math.abs(d) <= 1 &&
             haversineKm(list[i].latest, CLARKSTON) >
             haversineKm(list[worst].latest, CLARKSTON)) worst = i;
  }
  return worst;
}

function fitSignature() {
  return hosts.map(h => {
    const p = h.track && h.track.length ? h.track[h.track.length - 1] : null;
    return h.call + (p ? ':' + p.lat.toFixed(3) + ',' + p.lng.toFixed(3) + ',' + h.track.length : ':-');
  }).join('|') + '|' + FIT_MODE;
}

function frameBounds() {
  const live = hosts
    .filter(h => h.track && h.track.length)
    .map(h => ({ h, latest: h.track[h.track.length - 1] }));

  if (!live.length) {
    setInset(null);
    map.setView([CLARKSTON.lat, CLARKSTON.lng], FIT_FALLBACK_ZOOM);
    return;
  }

  // Everybody stays in the wide frame, always -- that long line out to
  // wherever somebody drove is the point of the board. What the spread
  // decides is whether the ones still together also need their own panel.
  //
  // Two separate questions. Whether to open at all is a plain distance with
  // a hysteresis band, so the panel does not blink while somebody idles on
  // the line. Who goes in it is a fraction of the current spread, so the
  // grouping keeps working whether the board is showing two states or the
  // whole country.
  const spread = spreadMi(live);
  const groupMi = spread * INSET_GROUP_FRACTION;
  const core = live.slice();
  while (core.length > 1 && spreadMi(core) > groupMi) {
    core.splice(mostOutlying(core), 1);
  }
  const limit = insetHosts.length ? INSET_CLEAR_MI : INSET_TRIGGER_MI;
  setInset(INSET_ENABLE && spread > limit &&
           core.length > 1 && core.length < live.length
    ? core.map(e => e.h)
    : null);

  const b = L.latLngBounds(
    live.reduce((acc, e) => acc.concat(hostFitPoints(e.h)), []));

  if (b.getNorthEast().equals(b.getSouthWest())) {
    map.setView(b.getCenter(), FIT_MAX_ZOOM, { animate: false });
    return;
  }
  // Reserve the inset's corner in the fit rather than letting the panel land
  // on top of a host. setInset has already laid the panel out, so its real
  // height is measurable here.
  const panel = document.getElementById('inset');
  const reserve = insetHosts.length ? panel.offsetHeight + 24 : 0;
  map.fitBounds(b, {
    paddingTopLeft: [FIT_PADDING_PX, FIT_PADDING_PX],
    paddingBottomRight: [FIT_PADDING_PX, FIT_PADDING_PX + reserve],
    maxZoom: FIT_MAX_ZOOM,
    animate: false
  });
}

/* ============================================================
   CARDS
   ============================================================ */
function buildCards() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  hosts.forEach(h => {
    const c = document.createElement('div');
    c.className = 'card';
    c.id = 'card-' + h.call;
    c.style.setProperty('--hc', h.color);
    c.innerHTML = `
      <div class="avatar"><img class="pose" alt=""><span class="ini">${h.initials || ''}</span></div>
      <div class="who">
        <div class="call">${h.call}</div>
        <div class="name">${h.name}</div>
        <div class="heard" data-heard>--</div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="state-pill" data-state><span class="sd"></span><span data-statetext>--</span></div></div>
        <div class="metric"><div class="val" data-miles>--</div><div class="lbl">Miles / 3 days</div></div>
        <div class="metric"><div class="val" data-roll>--</div><div class="lbl">Time rolling</div></div>
        <div class="metric"><div class="val" data-top>--</div><div class="lbl">Top speed</div></div>
        <div class="metric"><div class="val" data-beacons>--</div><div class="lbl">Beacons</div></div>
      </div>`;
    wrap.appendChild(c);
  });
}

/* ============================================================
   POSE SELECTION
   ============================================================ */
function poseFor(host, state) {
  const p = host.poses;
  if (!p) return null;
  const order = ({
    ROLLING:  ['mobile', 'portable', 'home'],
    PARKED:   ['portable', 'home', 'mobile'],
    HOME:     ['home', 'portable', 'mobile'],
    NOTHEARD: ['home', 'portable', 'mobile'],
  })[state] || ['home', 'portable', 'mobile'];
  for (const k of order) if (p[k]) return p[k];
  for (const k in p) if (p[k]) return p[k];
  return null;
}

function setPose(avatarEl, url) {
  if (!avatarEl) return;
  if (!url) { avatarEl.classList.remove('imgloaded'); avatarEl._pose = null; return; }
  if (avatarEl._pose === url) return;
  avatarEl._pose = url;
  const img = avatarEl.querySelector('img.pose');
  if (!img) return;
  img.onload  = () => { if (avatarEl._pose === url) avatarEl.classList.add('imgloaded'); };
  img.onerror = () => { if (avatarEl._pose === url) avatarEl.classList.remove('imgloaded'); };
  img.src = url;
}

/* ============================================================
   PER-HOST DERIVED STATE (current, history-focused)
   ============================================================ */
function deriveHost(h) {
  const track = h.track;
  if (!track || !track.length) return { empty: true };

  const latest = track[track.length-1];
  const ageMin = (Date.now() - latest.time) / 60000;

  let miles = 0, rollMs = 0, topKmh = 0;
  for (let i = 0; i < track.length; i++) {
    if (i > 0) {
      miles += haversineKm(track[i-1], track[i]);
      // time rolling: the beacon says we arrived here moving, so count the
      // gap since the previous beacon, capped so sparse gaps can't inflate it
      if (track[i].speed > MOVING_SPEED_KMH) {
        rollMs += Math.min(track[i].time - track[i-1].time,
                           ROLL_GAP_CAP_MIN * 60000);
      }
    }
    if (track[i].speed > topKmh && track[i].speed <= SPEED_SANITY_KMH) {
      topKmh = track[i].speed;
    }
  }
  miles *= KM_TO_MI;
  const rollH   = rollMs / 3600000;
  const topMph  = topKmh * KM_TO_MI;
  const beacons = track.length;

  let state;
  if (ageMin > STALE_MINUTES) state = 'NOTHEARD';
  else if (latest.speed > MOVING_SPEED_KMH) state = 'ROLLING';
  else if (haversineKm(latest, h.home) < HOME_RADIUS_KM) state = 'HOME';
  else state = 'PARKED';

  return { empty: false, latest, ageMin, miles, rollH, topMph, beacons, state };
}

function stateLabel(s) {
  return s === 'NOTHEARD' ? 'Not heard' : s.charAt(0) + s.slice(1).toLowerCase();
}
function ageText(min) {
  if (min < 1) return 'Heard just now';
  if (min < 60) return 'Heard ' + Math.round(min) + ' min ago';
  const hr = Math.floor(min/60);
  if (hr < 24) {
    const m = Math.round(min%60);
    return 'Heard ' + hr + 'h ' + (m ? m + 'm ' : '') + 'ago';
  }
  const d = Math.floor(hr/24), rh = hr%24;
  return 'Heard ' + d + 'd ' + (rh ? rh + 'h ' : '') + 'ago';
}

/* ============================================================
   RENDER LOOP  -  always-visible age-graded trails + traveling pulse
   ============================================================ */
function ll(p, m) { return (m || map).latLngToContainerPoint([p.lat, p.lng]); }

/* ---------- host glyphs ----------
   One source of truth for the marker shapes: the canvas head/pulse markers
   and the little SVG badges on the cards and callsign tags all come from
   here, so a host's glyph on the map always matches the one beside their
   name. Radii are nudged per shape because a triangle inscribed in r looks
   much smaller than a circle of r. */
function shapePoints(shape, cx, cy, r) {
  // A twelve-point cross; `rot` of PI/4 turns a plus into an x.
  const cross = (rot) => {
    const w = r * 0.40, e = r * 1.22;
    return [[-w,-e],[w,-e],[w,-w],[e,-w],[e,w],[w,w],
            [w,e],[-w,e],[-w,w],[-e,w],[-e,-w],[-w,-w]]
      .map(pt => [cx + pt[0] * Math.cos(rot) - pt[1] * Math.sin(rot),
                  cy + pt[0] * Math.sin(rot) + pt[1] * Math.cos(rot)]);
  };
  const poly = (n, rot, k) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = rot + i * 2 * Math.PI / n;
      out.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]);
    }
    return out;
  };
  switch (shape) {
    case 'triangle': return poly(3, -Math.PI / 2, 1.22);
    case 'square':   return poly(4,  Math.PI / 4, 1.06);
    case 'diamond':  return poly(4, -Math.PI / 2, 1.18);
    case 'pentagon': return poly(5, -Math.PI / 2, 1.12);
    case 'hexagon':  return poly(6, -Math.PI / 2, 1.06);
    case 'star': {
      const out = [];
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = r * (i % 2 ? 0.52 : 1.32);
        out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
      }
      return out;
    }
    case 'plus':  return cross(0);
    case 'cross': return cross(Math.PI / 4);          // the same arms, rotated
    case 'chevron':                                    // arrowhead, points up
      return [[0, -1.30], [1.15, 0.72], [0, 0.16], [-1.15, 0.72]]
        .map(pt => [cx + pt[0] * r, cy + pt[1] * r]);
    default: return null;   // circle
  }
}

// Traces the glyph on the trail canvas. Caller sets fillStyle and fills.
function shapePath(shape, x, y, r) {
  const pts = shapePoints(shape, x, y, r);
  ctx.beginPath();
  if (!pts) { ctx.arc(x, y, r, 0, Math.PI * 2); return; }
  pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
  ctx.closePath();
}

// The same glyph as inline SVG, for the roster cards and callsign tags.
function shapeSvg(shape, color, px) {
  const pts = shapePoints(shape, 10, 10, 7);
  const body = pts
    ? '<polygon points="' + pts.map(pt => pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ') + '"/>'
    : '<circle cx="10" cy="10" r="7"/>';
  return '<svg class="glyph" viewBox="0 0 20 20" width="' + px + '" height="' + px +
         '" fill="' + color + '" aria-hidden="true">' + body + '</svg>';
}

// Shift a projected polyline sideways by `off` pixels, using the averaged
// normals of adjacent segments so corners stay joined (transit-map offset).
function offsetPolyline(proj, off) {
  if (!off || proj.length < 2) return proj;
  const n = proj.length;
  const segNx = [], segNy = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = proj[i+1].x - proj[i].x, dy = proj[i+1].y - proj[i].y;
    const len = Math.hypot(dx, dy);
    if (len < 0.0001) { segNx.push(null); segNy.push(null); }
    else { segNx.push(-dy/len); segNy.push(dx/len); }
  }
  // fill degenerate segments with a neighbor's normal
  let lastX = 0, lastY = -1;
  for (let i = 0; i < n - 1; i++) {
    if (segNx[i] === null) { segNx[i] = lastX; segNy[i] = lastY; }
    else { lastX = segNx[i]; lastY = segNy[i]; }
  }
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    let nx, ny;
    if (i === 0)          { nx = segNx[0];   ny = segNy[0]; }
    else if (i === n - 1) { nx = segNx[n-2]; ny = segNy[n-2]; }
    else {
      nx = segNx[i-1] + segNx[i];
      ny = segNy[i-1] + segNy[i];
      const len = Math.hypot(nx, ny);
      if (len < 0.0001) { nx = segNx[i]; ny = segNy[i]; }
      else { nx /= len; ny /= len; }
    }
    out[i] = { x: proj[i].x + nx*off, y: proj[i].y + ny*off };
  }
  return out;
}

function renderLoop(nowMs) {
  if (nowMs - lastDrawMs >= FRAME_MIN_MS) {
    lastDrawMs = nowMs;
    drawTrails();
    drawAvatars();
    if (insetHosts.length) { drawInsetTrails(); drawInsetAvatars(); }
  }
  requestAnimationFrame(renderLoop);
}

function drawTrails() {
  const w = trailCanvas.clientWidth, h = trailCanvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const now = Date.now();
  const windowMs = TRAIL_HOURS * 3600 * 1000;

  hosts.forEach((host, hi) => {
    const pts = host.track;
    if (!pts || pts.length < 2) return;

    // project once per frame, then shift sideways per host so overlapping
    // routes render as parallel ribbons instead of stacking
    const off = (hi - (hosts.length - 1) / 2) * TRAIL_OFFSET_PX;
    const proj = offsetPolyline(pts.map(p => ll(p)), off);

    // A host framed out of the view projects hundreds of thousands of pixels
    // off canvas. None of it can land on the board, so skip the whole host
    // rather than stroking a few hundred invisible segments every frame --
    // this thing runs 24/7 on a stick PC. The edge beacon carries them.
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let i = 0; i < proj.length; i++) {
      if (proj[i].x < minX) minX = proj[i].x;
      if (proj[i].x > maxX) maxX = proj[i].x;
      if (proj[i].y < minY) minY = proj[i].y;
      if (proj[i].y > maxY) maxY = proj[i].y;
    }
    if (maxX < -TRAIL_CULL_PX || minX > w + TRAIL_CULL_PX ||
        maxY < -TRAIL_CULL_PX || minY > h + TRAIL_CULL_PX) return;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Host-colored trail; age is expressed as fade + taper. Fresh segments are
    // bright and full width; old ones thin and dimmer, but never below
    // TRAIL_ALPHA_OLD -- fading all the way to zero made the far end of the
    // window invisible on the board. Two passes: soft glow, then core.
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 1; i < proj.length; i++) {
        const t = Math.min(1, (now - pts[i].time) / windowMs);  // 0 fresh -> 1 old
        const fade = Math.pow(1 - t, TRAIL_FADE_GAMMA);         // 1 fresh -> 0 old
        const core = TRAIL_ALPHA_OLD + (TRAIL_ALPHA_FRESH - TRAIL_ALPHA_OLD) * fade;
        const alpha = pass === 0
          ? CASING_ALPHA * (core / TRAIL_ALPHA_FRESH)
          : core;
        if (alpha < 0.02) continue;
        ctx.strokeStyle = hexA(host.color, alpha);
        ctx.lineWidth = pass === 0
          ? CASING_WIDTH
          : (TRAIL_WIDTH * (TRAIL_TAPER_OLD + (1 - TRAIL_TAPER_OLD) * fade));
        ctx.beginPath();
        ctx.moveTo(proj[i-1].x, proj[i-1].y);
        ctx.lineTo(proj[i].x, proj[i].y);
        ctx.stroke();
      }
    }

    // Glyph stamps every TRAIL_GLYPH_HOURS. The head marker is usually hidden
    // behind the host's avatar, so these are what tells two overlapping routes
    // apart along their length. They carry the segment's own age opacity.
    if (TRAIL_GLYPH_HOURS > 0) {
      const stepMs = TRAIL_GLYPH_HOURS * 3600 * 1000;
      const minGapPx = TRAIL_GLYPH_R * 1.8;   // a host parked overnight would
                                              // otherwise stamp a clump here
      let lastBucket = null, lastStamp = null;
      for (let i = 0; i < proj.length; i++) {
        const bucket = Math.floor((now - pts[i].time) / stepMs);
        if (bucket === lastBucket) continue;
        if (lastStamp && Math.hypot(proj[i].x - lastStamp.x, proj[i].y - lastStamp.y) < minGapPx) continue;
        lastBucket = bucket;
        lastStamp = proj[i];
        const t = Math.min(1, (now - pts[i].time) / windowMs);
        const fade = Math.pow(1 - t, TRAIL_FADE_GAMMA);
        const a = TRAIL_ALPHA_OLD + (TRAIL_ALPHA_FRESH - TRAIL_ALPHA_OLD) * fade;
        shapePath(host.shape, proj[i].x, proj[i].y, TRAIL_GLYPH_R);
        ctx.fillStyle = hexA(host.color, a);
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(253,248,229,' + (0.55 * a).toFixed(3) + ')';
        ctx.stroke();
      }
    }

    // midnight ticks: small cream dots where the local day rolls over
    if (MIDNIGHT_TICKS) {
      ctx.fillStyle = 'rgba(253,248,229,0.85)';
      let prevDay = new Date(pts[0].time).getDate();
      for (let i = 1; i < pts.length; i++) {
        const d = new Date(pts[i].time).getDate();
        if (d !== prevDay) {
          ctx.beginPath();
          ctx.arc(proj[i].x, proj[i].y, 3, 0, Math.PI*2);
          ctx.fill();
          prevDay = d;
        }
      }
    }

    // traveling pulse: a bright dot running tail -> head, offset per host
    const hostOffset = (host.call.charCodeAt(0) % 7) / 7;
    const tt = ((performance.now()/1000 / PULSE_PERIOD_S) + hostOffset) % 1;
    const fi = tt * (proj.length - 1);
    const i0 = Math.floor(fi), f = fi - i0;
    const i1 = Math.min(i0 + 1, proj.length - 1);
    const px = proj[i0].x + (proj[i1].x - proj[i0].x) * f;
    const py = proj[i0].y + (proj[i1].y - proj[i0].y) * f;
    ctx.fillStyle = hexA(host.color, 0.30);
    shapePath(host.shape, px, py, 9); ctx.fill();
    ctx.fillStyle = 'rgba(253,248,229,0.95)';
    shapePath(host.shape, px, py, 4); ctx.fill();

    // head: soft halo + solid core in host color (plain fills, no shadowBlur)
    const head = proj[proj.length - 1];
    ctx.fillStyle = hexA(host.color, 0.25);
    shapePath(host.shape, head.x, head.y, 11); ctx.fill();
    ctx.fillStyle = hexA(host.color, 0.95);
    shapePath(host.shape, head.x, head.y, 6); ctx.fill();
  });
}

/* ---------- avatars (always at the latest position) ---------- */
const markerEls = {};
function drawAvatars() {
  hosts.forEach(host => {
    let el = markerEls[host.call];
    if (!el) {
      el = document.createElement('div');
      el.className = 'host-marker';
      el.style.setProperty('--hc', host.color);
      el.innerHTML = `
        <div class="center">
          <div class="host-ring"></div>
          <div class="host-beam"></div>
          <div class="host-body"><div class="host-avatar"><img class="pose" alt=""><span class="ini">${host.initials || ''}</span></div></div>
          <div class="host-tag">${shapeSvg(host.shape, host.color, 13)}${host.call}</div>
        </div>`;
      avatarLayer.appendChild(el);
      markerEls[host.call] = el;
    }
    const d = deriveHost(host);
    if (d.empty) { el.style.display = 'none'; return; }
    el.style.display = '';

    const pt = ll(d.latest);
    el.style.transform = `translate3d(${pt.x}px, ${pt.y}px, 0)`;
    el.querySelector('.host-beam').style.setProperty('--course', (d.latest.course||0) + 'deg');

    setPose(el.querySelector('.host-avatar'), poseFor(host, d.state));

    el.classList.toggle('rolling', d.state === 'ROLLING');
    el.classList.toggle('dim', d.state === 'NOTHEARD');
    el.classList.toggle('grouped', insetHosts.indexOf(host.call) !== -1);
  });
}

/* ============================================================
   MASTER TICK  -  clock, cards, footer, poll
   ============================================================ */
function masterTick() {
  tickCount++;

  const now = new Date();
  const zz = String(now.getUTCHours()).padStart(2,'0') + ':' +
             String(now.getUTCMinutes()).padStart(2,'0') + ':' +
             String(now.getUTCSeconds()).padStart(2,'0');
  document.getElementById('zulu').innerHTML = zz + '<span class="z">Z</span>';
  document.getElementById('local').textContent =
    now.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' }) + '  ' +
    now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

  hosts.forEach(host => {
    const card = document.getElementById('card-' + host.call);
    if (!card) return;
    const d = deriveHost(host);
    if (d.empty) {
      // Nothing heard in the whole window. Keep the metrics as dashes -- there
      // genuinely is no data -- but show the dimmed home pose so the host is
      // still recognisable on the board.
      card.className = 'card nodata';
      card.style.setProperty('--hc', host.color);
      setPose(card.querySelector('.avatar'), poseFor(host, 'NODATA'));
      // Reset the readouts: a host can go from having a trail to having none
      // when the window rolls past their last beacon, and stale numbers under
      // a dimmed portrait would read as current.
      card.querySelector('[data-state]').className = 'state-pill';
      card.querySelector('[data-statetext]').textContent = 'No beacons';
      card.querySelector('[data-heard]').textContent =
        'Not heard in ' + TRAIL_HOURS + 'h';
      ['[data-miles]','[data-roll]','[data-top]','[data-beacons]']
        .forEach(sel => { card.querySelector(sel).textContent = '\u2014'; });
      return;
    }
    card.className = 'card' + (d.state==='NOTHEARD' ? ' notheard' : '');
    card.style.setProperty('--hc', host.color);

    const pill = card.querySelector('[data-state]');
    pill.className = 'state-pill state-' + d.state;
    const city = nearestCity(d.latest);
    card.querySelector('[data-statetext]').textContent =
      d.state === 'ROLLING' ? 'Rolling \u00b7 ' + city : city;
    card.querySelector('[data-heard]').textContent = ageText(d.ageMin);
    setPose(card.querySelector('.avatar'), poseFor(host, d.state));

    card.querySelector('[data-miles]').innerHTML = d.miles.toFixed(1) + '<small>mi</small>';
    card.querySelector('[data-roll]').innerHTML = d.rollH >= 1
      ? d.rollH.toFixed(1) + '<small>h</small>'
      : Math.round(d.rollH * 60) + '<small>m</small>';
    card.querySelector('[data-top]').innerHTML = Math.round(d.topMph) + '<small>mph</small>';
    card.querySelector('[data-beacons]').innerHTML = d.beacons + '<small>rx</small>';
  });

  const ageMin = (Date.now() - dataGeneratedMs) / 60000;
  document.getElementById('srcText').textContent = sourceLabel;
  document.getElementById('updated').textContent =
    'Last update ' + (ageMin < 1 ? 'just now' : Math.round(ageMin) + ' min ago');
  document.getElementById('staleBadge').classList.toggle('show',
    sourceLabel.startsWith('Live') && ageMin > DATA_STALE_MIN);

  if (tickCount % POLL_SECONDS === 0) loadData();
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  initMap();
  await loadData();
  frameBounds();
  lastFitSig = fitSignature();
  masterTick();
  setInterval(masterTick, MASTER_TICK_MS);
  requestAnimationFrame(renderLoop);
}
window.addEventListener('load', boot);
</script>
