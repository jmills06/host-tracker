# Place this file at:  .github/workflows/aprs-poll.yml
name: APRS host poll

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min. See notes in SETUP.md before going faster.
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # allows the job to commit host-tracker.json back

concurrency:
  group: aprs-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Poll aprs.fi
        env:
          APRS_API_KEY: ${{ secrets.APRS_API_KEY }}
          OUT_FILE: host-tracker.json
        run: python aprs_poller.py

      - name: Commit and push (resilient to concurrent updates)
        run: |
          if [[ -z "$(git status --porcelain -- host-tracker.json history)" ]]; then
            echo "no change this run"; exit 0
          fi
          git config user.name  "aprs-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # keep our freshly generated file, then always rebuild the commit
          # on top of the very latest main so a moving remote can't reject us
          cp host-tracker.json /tmp/host-tracker.json
          # Two kinds of rejection end up here: a race with another runner
          # (fixed by re-syncing) and GitHub itself answering 500 Internal
          # Server Error for a short spell (fixed only by waiting). Back off
          # exponentially, 2+4+8+16+32+60 s, so a brief GitHub blip has about
          # two minutes to clear instead of the ten seconds it used to get.
          delays=(2 4 8 16 32 60)
          for i in 1 2 3 4 5 6 7; do
            git fetch origin main
            git reset --hard origin/main

            # The live window is a full snapshot, so copying ours back over
            # whatever the remote has is right: it is the newer of the two.
            cp /tmp/host-tracker.json host-tracker.json

            # The archive is NOT a snapshot. The reset above just threw away
            # our appended lines, and a concurrent runner may have added its
            # own, so copying a saved copy back would drop them. Re-run the
            # append instead: it reads whatever is now on disk and adds only
            # the points missing from it, deduped on (call, time). That merges
            # rather than clobbers, and repeating it on every retry is free.
            python aprs_poller.py --append-pending

            git add host-tracker.json history
            if git diff --cached --quiet; then
              echo "remote already up to date"; exit 0
            fi
            git commit -m "aprs: update host positions [skip ci]"
            if git push origin HEAD:main; then
              echo "pushed"; exit 0
            fi
            if (( i > ${#delays[@]} )); then break; fi
            wait=${delays[$((i-1))]}
            echo "push rejected (attempt $i), re-syncing and retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::push failed after $i attempts; GitHub may be having an outage (check githubstatus.com)" >&2
          exit 1
